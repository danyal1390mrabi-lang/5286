<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمون دختر بودن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1c2e27;
    --board-dark:#16241f;
    --chalk:#eef0e4;
    --chalk-dim:#a9b6ac;
    --chalk-yellow:#e8c468;
    --chalk-green:#8fbf8a;
    --chalk-red:#d1817a;
    --line: rgba(238,240,228,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 34px),
      radial-gradient(1000px 500px at 50% -5%, rgba(232,196,104,0.06), transparent 60%),
      var(--board);
    color:var(--chalk);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:40px 20px 80px;
    min-height:100vh;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--chalk-yellow);
    margin-bottom:10px;
  }
  h1.title{
    font-size:clamp(30px,6vw,42px);
    margin:0 0 6px;
    font-weight:800;
    letter-spacing:-.01em;
  }
  .subtitle{ color:var(--chalk-dim); font-size:14.5px; line-height:1.8; margin:0 0 32px; }

  /* ---------- tally progress (signature) ---------- */
  .tally{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    margin-bottom:36px;
    padding-bottom:20px;
    border-bottom:1px dashed var(--line);
  }
  .tally-mark{
    width:8px;
    height:26px;
    background:rgba(238,240,228,0.12);
    border-radius:1px;
    transition:background .3s ease, transform .3s ease;
  }
  .tally-mark.done{ background:var(--chalk-yellow); }
  .tally-mark.current{ background:var(--chalk); transform:scaleY(1.15); }
  .tally-caption{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--chalk-dim);
    margin-top:10px;
    letter-spacing:.03em;
  }

  /* ---------- question card ---------- */
  .qnum{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--chalk-yellow);
    margin-bottom:12px;
    letter-spacing:.05em;
  }
  .qtext{
    font-size:21px;
    line-height:1.7;
    font-weight:600;
    margin:0 0 26px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:30px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 16px;
    border:1px solid var(--line);
    border-radius:3px;
    background:rgba(255,255,255,0.02);
    cursor:pointer;
    text-align:right;
    font-family:inherit;
    font-size:15px;
    color:var(--chalk);
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover{ border-color:rgba(232,196,104,0.5); background:rgba(232,196,104,0.05); }
  .opt:focus-visible{ outline:2px solid var(--chalk-yellow); outline-offset:2px; }
  .opt-letter{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    width:24px; height:24px;
    border:1px solid var(--line);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    color:var(--chalk-dim);
  }
  .opt.selected{ border-color:var(--chalk-yellow); background:rgba(232,196,104,0.1); }
  .opt.selected .opt-letter{ background:var(--chalk-yellow); color:var(--board); border-color:var(--chalk-yellow); }
  .opt.correct{ border-color:var(--chalk-green); background:rgba(143,191,138,0.12); }
  .opt.correct .opt-letter{ background:var(--chalk-green); color:var(--board); border-color:var(--chalk-green); }
  .opt.wrong{ border-color:var(--chalk-red); background:rgba(209,129,122,0.12); }
  .opt.wrong .opt-letter{ background:var(--chalk-red); color:var(--board); border-color:var(--chalk-red); }
  .opt[disabled]{ cursor:default; }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  .btn{
    padding:14px 26px;
    border-radius:3px;
    font-size:14.5px;
    font-weight:600;
    transition:transform .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:var(--chalk-yellow);
    color:var(--board-dark);
  }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--chalk-dim);
  }
  .btn-ghost:hover{ border-color:var(--chalk-dim); color:var(--chalk); }

  /* ---------- results ---------- */
  .results{ text-align:center; padding-top:20px; }
  .score-ring{
    width:150px; height:150px;
    margin:0 auto 26px;
    position:relative;
  }
  .score-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:38px;
    font-weight:600;
  }
  .score-total{ font-size:15px; color:var(--chalk-dim); }
  .results h2{ font-size:24px; margin:0 0 8px; }
  .results p{ color:var(--chalk-dim); font-size:14px; margin:0 0 30px; }
  .review-list{ text-align:right; margin-bottom:30px; }
  .review-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .review-item:last-child{ border-bottom:none; }
  .review-q{ margin-bottom:6px; color:var(--chalk); }
  .review-a{ font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .review-a.correct{ color:var(--chalk-green); }
  .review-a.wrong{ color:var(--chalk-red); }

  .hidden{ display:none !important; }
  .fade-in{ animation: fadeIn .4s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  @media (prefers-reduced-motion: reduce){
    .fade-in, .tally-mark{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">آزمون دختر بودن/div>
  <h1 class="title">۵ سوال</h1>
  <p class="subtitle">به هر سوال یک گزینه را انتخاب کنید. در پایان نمره و مرور پاسخ‌ها را می‌بینید.اگر 100%بود شما تی 2 دقیق میتونی وارد سایت بشین</p>

  <div class="tally" id="tally"></div>

  <!-- QUESTION SCREEN -->
  <div id="screen-quiz">
    <div class="qnum" id="qnum">سوال ۱ از ۲۰</div>
    <p class="qtext" id="qtext"></p>
    <div class="options" id="options"></div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="btnPrev" onclick="goPrev()">قبلی</button>
      <button class="btn btn-primary" id="btnNext" onclick="goNext()" disabled>سوال بعدی</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="screen-results" class="results hidden">
    <div class="eyebrow" style="text-align:center;">نتیجه آزمون</div>
    <h2 id="resultTitle">آفرین!</h2>
    <p class="score-num" id="scoreNum" style="font-size:52px;"></p>
    <p id="resultSub"></p>
    <div class="review-list" id="reviewList"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="restartQuiz()">شما اگر نمرت خوب باشه 2 دقیقه دیگه سایت برات بازه</button>
  </div>

</div>

<script>
/* ====================================================================
   داده‌ی سوالات — همین‌جا سوالای خودتون رو جایگزین کنید.
   هر سوال یک آبجکته با: q (متن سوال)، options (۴ گزینه)، answer (ایندکس گزینه‌ی درست از ۰)
   نمونه‌ی زیر فقط جای‌گذارست، با سوالای کتاب علوم خودتون عوضش کنید.
   ==================================================================== */
const QUESTIONS = [
  { q: "سوال ۱ —پریودی چیست", options: ["گزینه خون ریزی و کرد شکم","گزینه قلقلک نا پندار","گزینه احساس سرگیجه ","گزینه درد شکم "], answer: 0 },
  { q: "سوال ۲ — لباس زیر(سوتین)از چه واحد سایزی استفاده میشه", options: ["گزینه x xl l است","گزینه @@است","گزینه سانتی متر","گزینه متر"], answer: 0 },
  { q: "سوال ۳ -ایا دور سینه مو داره", options: ["گزینه زیاد و پر پشت هست","گزینه خیلی کم داره","گزینه کمی داره","گزینه نداره"], answer: 0 },
  { q: "سوال ۴ — هنگام دخول چه احساسی دارد", options: ["گزینه احساس درد ارضاع ","گزینه احساس ارضاع","گزینه احساس درد","گزینه بی احساس"], answer: 0 },
  { q: "سوال ۵ —چیزی که باید در پسر ها باشه تا یک دختر دوسش داشته باشه", options: ["گزینه اتماد به نفس","گزینه ماشین","گزینه کار","گزینه پول"], answer: 0 },
];

const LETTERS = ['الف','ب','ج','د','ه','و'];
let current = 0;
let userAnswers = new Array(QUESTIONS.length).fill(null);

const tallyEl = document.getElementById('tally');
const qnumEl = document.getElementById('qnum');
const qtextEl = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');

function buildTally(){
  tallyEl.innerHTML = '';
  QUESTIONS.forEach((_, i)=>{
    const m = document.createElement('div');
    m.className = 'tally-mark';
    m.id = 'tm-' + i;
    tallyEl.appendChild(m);
  });
  const cap = document.createElement('div');
  cap.className = 'tally-caption';
  cap.id = 'tallyCaption';
  tallyEl.appendChild(cap);
}

function updateTally(){
  QUESTIONS.forEach((_, i)=>{
    const m = document.getElementById('tm-' + i);
    m.classList.toggle('done', userAnswers[i] !== null);
    m.classList.toggle('current', i === current);
  });
  const answered = userAnswers.filter(a => a !== null).length;
  document.getElementById('tallyCaption').textContent = answered + ' از ' + QUESTIONS.length + ' سوال پاسخ داده شده';
}

function renderQuestion(){
  const item = QUESTIONS[current];
  qnumEl.textContent = 'سوال ' + toFa(current + 1) + ' از ' + toFa(QUESTIONS.length);
  qtextEl.textContent = item.q;
  optionsEl.innerHTML = '';
  item.options.forEach((opt, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.innerHTML = '<span class="opt-letter">' + LETTERS[i] + '</span><span>' + opt + '</span>';
    if(userAnswers[current] === i) b.classList.add('selected');
    b.onclick = ()=> selectAnswer(i);
    optionsEl.appendChild(b);
  });
  btnPrev.disabled = current === 0;
  btnNext.disabled = userAnswers[current] === null;
  btnNext.textContent = current === QUESTIONS.length - 1 ? 'مشاهده نتیجه' : 'سوال بعدی';
  updateTally();
}

function selectAnswer(i){
  userAnswers[current] = i;
  renderQuestion();
}

function goNext(){
  if(userAnswers[current] === null) return;
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

function goPrev(){
  if(current > 0){
    current--;
    renderQuestion();
  }
}

function showResults(){
  document.getElementById('screen-quiz').classList.add('hidden');
  const resultsEl = document.getElementById('screen-results');
  resultsEl.classList.remove('hidden');
  resultsEl.classList.add('fade-in');

  let correctCount = 0;
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  QUESTIONS.forEach((item, i)=>{
    const isCorrect = userAnswers[i] === item.answer;
    if(isCorrect) correctCount++;
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML =
      '<div class="review-q">' + toFa(i+1) + '. ' + item.q + '</div>' +
      '<div class="review-a ' + (isCorrect ? 'correct' : 'wrong') + '">' +
        (isCorrect ? '✓ درست' : '✗ نادرست — پاسخ صحیح: ' + item.options[item.answer]) +
      '</div>';
    reviewList.appendChild(div);
  });

  document.getElementById('scoreNum').textContent = toFa(correctCount) + ' / ' + toFa(QUESTIONS.length);
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);
  document.getElementById('resultTitle').textContent =
    pct >= 80 ? 'دختر خانوم عزیز شما 2 دقیق دیگه سایت برات بازه' : pct >= 50 ? 'تو پسری گم شو' : 'تو پسری گم شو';
  document.getElementById('resultSub').textContent = toFa(pct) + '٪ پاسخ‌های درست';
}

function restartQuiz(){
  current = 0;
  userAnswers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQuestion();
}

function toFa(n){
  const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).split('').map(d => fa[d] ?? d).join('');
}

buildTally();
renderQuestion();
</script>
</body>
</html>
